<style>:root{--bg0:#07061a;--bg1:#0f0b2e;--bg2:#1b1347;--pan:rgba(24,18,62,.78);--line:rgba(160,140,255,.28);--tx:#f1eeff;--tx2:#b4abe0;--acc:#7c5cff;--acc2:#35d4ff;--gold:#ffc23d;--pink:#ff4d8d;--good:#5eea8d;--bad:#ff5a7a;--hdr:64px;--nav:74px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--tx);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:15px;touch-action:manipulation;user-select:none}
h1,h2,h3,h4{font-family:"Baloo 2","Be Vietnam Pro",sans-serif;margin:0 0 8px;line-height:1.15}
h1{font-size:34px}h2{font-size:26px}h3{font-size:19px}h4{font-size:15px;color:var(--tx2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
#app{position:fixed;inset:0;background:radial-gradient(1200px 700px at 20% -10%,#2b1b73 0,transparent 60%),radial-gradient(900px 600px at 100% 110%,#0b3a66 0,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg0));display:grid;grid-template-rows:var(--hdr) 1fr var(--nav);overflow:hidden}
#fx-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px;background:linear-gradient(180deg,rgba(10,8,34,.95),rgba(10,8,34,.6));border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--pink));color:#fff;box-shadow:0 0 14px rgba(124,92,255,.7);flex:none}
.tb-name{display:flex;flex-direction:column;gap:2px;min-width:0}.tb-name b{font-family:"Baloo 2";font-size:17px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb-name small{color:var(--tx2);font-size:11px}
.xpbar{height:7px;width:150px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:5px;transition:width .4s}.xpbar.big{height:12px;width:100%}
.tb-cur{display:flex;gap:8px;flex-wrap:nowrap}.cur{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-family:"Baloo 2";font-weight:700}

#nav{position:relative;z-index:2;display:flex;justify-content:safe center;gap:4px;padding:6px 10px;background:linear-gradient(0deg,rgba(10,8,34,.97),rgba(10,8,34,.7));border-top:1px solid var(--line);overflow-x:auto}
.nv{position:relative;flex:1 0 64px;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;color:var(--tx2);font-size:11.5px;font-weight:600;transition:.2s}

.ico{display:block;flex:none}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-weight:600;transition:.15s}

.btn.dis,.btn:disabled{opacity:.45;filter:grayscale(.5)}.btn.danger{background:linear-gradient(180deg,#ff5a7a,#b8243f);border-color:#ff9bb0}.btn.sm{padding:6px 12px;font-size:13px}

.btn-big:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}.btn-big:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #301a8a}.btn-big.alt{background:linear-gradient(180deg,#ff7aa8,#e0306f);border-color:#ffc0d6;box-shadow:0 6px 0 #8a1440,0 10px 24px rgba(224,48,111,.5)}.btn-big:disabled{opacity:.5;filter:grayscale(.6)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed rgba(160,140,255,.18)}.kv span{color:var(--tx2)}.kv b{font-family:"Baloo 2";font-size:16px;text-align:right}
.pbar{height:9px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;margin:4px 0}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--good));border-radius:6px;transition:width .4s}.pbar.m i{background:linear-gradient(90deg,#ff4d8d,#ffb347)}.pbar.l i{background:linear-gradient(90deg,#ffc23d,#fff0a8)}
.sub{color:var(--tx2);margin:4px 0 10px}.empty{color:var(--tx2);text-align:center;padding:30px 10px}.center{text-align:center}.good{color:var(--good)}.bad{color:var(--bad)}.big{font-family:"Baloo 2";font-size:20px;margin:4px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed rgba(160,140,255,.18)}.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
input[type=range]{accent-color:var(--acc);width:220px}input[type=text],input[type=search],select{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;color:#fff;padding:8px 12px;font:inherit}
.sw{width:46px;height:26px;border-radius:14px;background:rgba(255,255,255,.18);position:relative;transition:.2s;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}input[type=checkbox]{display:none}input:checked+.sw{background:var(--good)}input:checked+.sw::after{left:23px}
.tabs{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}.tabs button,.chip{padding:7px 16px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:600;display:inline-flex;gap:6px;align-items:center}.tabs button.on,.chip.on{background:linear-gradient(180deg,var(--acc),#4a2fd0);border-color:#c9b8ff}
.r-rare{--rc:#4cc3ff;--rg:#1b8fd6;--r1:#1e5f9e;--r2:#0d2a4a}.r-epic{--rc:#c77dff;--rg:#9333ea;--r1:#6a2ba8;--r2:#2a1250}.r-legendary{--rc:#ffc23d;--rg:#f59e0b;--r1:#9c5f0a;--r2:#3d2404}.r-mythic{--rc:#ff4d8d;--rg:#ff1f6b;--r1:#a3123f;--r2:#3a0620}
h3.r-mythic,h3.r-legendary,h3.r-epic,h3.r-rare{color:var(--rc)}.chip.r-rare.on,.chip.r-epic.on,.chip.r-legendary.on,.chip.r-mythic.on{background:linear-gradient(180deg,var(--rc),var(--r1))}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.ucard{position:relative;aspect-ratio:3/4.1;border-radius:14px;border:2px solid var(--rc,#444);background:linear-gradient(180deg,var(--r1,#333),var(--r2,#111));box-shadow:0 0 12px -2px var(--rg,transparent),inset 0 0 18px rgba(0,0,0,.4);overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
.ucard:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 0 22px 0 var(--rg,transparent)}.ucard.sel{outline:3px solid #fff;outline-offset:2px}
.ucard.empty{display:grid;place-items:center;color:var(--tx2);border-style:dashed;background:rgba(255,255,255,.04);font-size:26px;cursor:default}
.u-art{position:absolute;inset:0}.u-art img{width:100%;height:100%;object-fit:cover;object-position:center 8%}
.u-top{position:relative;display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-family:"Baloo 2";font-weight:700;font-size:12px;text-shadow:0 1px 3px #000;z-index:2}
.lv{background:rgba(0,0,0,.55);padding:0 7px;border-radius:9px}.evrow{display:flex;color:var(--gold)}.evs{opacity:.25}.evs.on{opacity:1;filter:drop-shadow(0 0 4px var(--gold))}
.u-badges{position:absolute;top:26px;left:5px;display:flex;flex-direction:column;gap:3px;z-index:3}.bd{font-style:normal;font-size:10px;font-weight:700;padding:1px 5px;border-radius:7px;background:rgba(0,0,0,.65);display:inline-flex;align-items:center}.bd.team{background:var(--acc)}.bd.fav{color:#ff8aa8}.bd.lock{color:#ffd75e}
.u-name{position:relative;margin-top:auto;padding:16px 6px 3px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);text-align:center;z-index:2;display:flex;flex-direction:column;line-height:1.1}.u-name b{font-family:"Baloo 2";font-size:15px}.u-name small{font-size:10px;color:#ddd;opacity:.85}
.u-trait{position:relative;z-index:2;background:rgba(0,0,0,.85);padding:3px 4px;display:flex;justify-content:center}
.tchip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;color:var(--c,#ccc);background:rgba(0,0,0,.45);border:1px solid color-mix(in srgb,var(--c,#888) 60%,transparent)}.tchip.sm{font-size:10.5px;padding:1px 6px}.tchip.none{color:#888;border-color:#444}.tchip.tr-mythic,.tchip.tr-secret{text-shadow:0 0 8px var(--g)}
.ucard.sm{width:96px;aspect-ratio:3/4}.ucard.xs{aspect-ratio:3/4}.ucard.xs .u-name b{font-size:12px}.ucard.xs .u-top{font-size:10px}.ucard.lg{width:200px}
.ucard.r-legendary::after,.ucard.r-mythic::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.4s infinite;pointer-events:none;z-index:4}
.ucard.r-mythic{animation:mythicPulse 2.4s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}@keyframes mythicPulse{50%{box-shadow:0 0 28px 3px var(--rg)}}
.newtag{position:absolute;top:26px;right:4px;z-index:5;background:var(--pink);font-style:normal;font-size:10px;font-weight:800;padding:1px 6px;border-radius:7px;animation:pop .6s infinite alternate}@keyframes pop{to{transform:scale(1.15)}}
.team-strip{display:flex;gap:8px;flex-wrap:wrap}.team-strip .ucard{flex:none}.ucard.sm .u-name b{font-size:13px}.ucard.xs{width:78px}
.lobby{display:flex;flex-direction:column;gap:16px;max-width:1280px;margin:0 auto}
.hero{position:relative;min-height:380px;border-radius:22px;overflow:hidden;border:1px solid var(--line);display:grid;grid-template-columns:1.3fr 1fr;align-items:end;background:linear-gradient(135deg,#1d0f5c,#0a2a5e 60%,#2a0f4e)}
.hero-bg{position:absolute;inset:0;background:radial-gradient(500px 300px at 30% 80%,rgba(255,255,255,.18),transparent),radial-gradient(400px 300px at 80% 20%,rgba(255,77,141,.35),transparent),conic-gradient(from 0deg at 30% 100%,transparent,rgba(124,92,255,.25),transparent 30%,rgba(53,212,255,.2),transparent 60%);animation:slowspin 30s linear infinite}
@keyframes slowspin{to{filter:hue-rotate(40deg)}}
.hero-team{position:relative;display:flex;align-items:flex-end;justify-content:center;height:100%;padding:0 10px;min-height:340px}.hero-u{width:200px;margin:0 -34px;animation:float 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.35s);filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))}.hero-u:nth-child(1){z-index:3;width:260px}.hero-u:nth-child(2){z-index:2}.hero-u:nth-child(3){z-index:2}.hero-u img{width:100%;display:block}
@keyframes float{50%{transform:translateY(-10px)}}
.hero-info{position:relative;padding:28px;align-self:center}.hero-info h1{background:linear-gradient(90deg,#fff,#b8a3ff,#6fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:40px}.hero-btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px}
.lob-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.battle-sel{display:grid;grid-template-columns:1fr 360px;gap:16px;max-width:1300px;margin:0 auto}.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-content:start}
.mapcard{border-radius:18px;overflow:hidden;border:2px solid var(--line);background:var(--pan);transition:.2s}.mapcard.on{border-color:var(--acc2);box-shadow:0 0 22px rgba(53,212,255,.35)}.mc-img{height:150px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end}.mc-img span{width:100%;padding:24px 12px 8px;font-family:"Baloo 2";font-weight:800;font-size:20px;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);text-shadow:0 2px 4px #000}
.mc-acts{display:flex;gap:6px;padding:8px}.act{flex:1;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}.act.on{background:linear-gradient(180deg,var(--acc),#4a2fd0);border-color:#c9b8ff}.act.locked{opacity:.5}.sts{display:flex;color:var(--gold)}.detail{position:sticky;top:0;align-self:start}
.summon{max-width:1250px;margin:0 auto}.banner-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.banner-tabs button{padding:9px 20px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700}.banner-tabs button.on{background:var(--c);color:#06142a;box-shadow:0 0 18px var(--c)}
.banner{position:relative;border-radius:24px;overflow:hidden;min-height:480px;display:grid;grid-template-columns:1.1fr 1fr;border:2px solid var(--c);box-shadow:0 0 36px -6px var(--c);background:#0a0820}
.bn-bg{position:absolute;inset:0;background:radial-gradient(500px 400px at 30% 60%,color-mix(in srgb,var(--c) 45%,transparent),transparent),conic-gradient(from 90deg at 30% 100%,transparent,color-mix(in srgb,var(--c) 30%,transparent),transparent 25%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%);animation:slowspin 16s linear infinite alternate}
.bn-art{position:relative;display:flex;justify-content:center;align-items:flex-end;padding-top:20px}.bn-art img{height:380px;min-width:0;flex:0 1 auto;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55));animation:float 3.6s ease-in-out infinite;margin:0 -24px}.bn-art img:only-child{height:450px;margin:0}
.bn-info{position:relative;padding:26px}.rates{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.rt{padding:5px 12px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid var(--rc);display:flex;gap:8px;font-family:"Baloo 2";font-weight:700}.rt b{color:var(--rc)}
.pity{background:rgba(0,0,0,.3);padding:10px 14px;border-radius:14px;margin:10px 0}.pity div:not(.pbar){display:flex;justify-content:space-between}.pity small{display:block;color:var(--tx2);margin-top:4px}.sm-btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.sm-btns .btn-big{flex-direction:column;gap:2px;font-size:19px;padding:10px 24px}.sm-links{display:flex;gap:8px;margin-top:14px}
.inv{max-width:1300px;margin:0 auto}.team-panel{margin-bottom:12px}.filters{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0}.chips,.fr-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.main.wide{max-width:1000px;margin:0 auto}.rr-stage{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;margin:12px 0}.rr-unit{text-align:center}.rr-arrow{transform:rotate(90deg);color:var(--acc2)}
.rr-trait{min-width:230px;max-width:290px;text-align:center}.rr-trait.new .tbig{animation:pop2 .5s}@keyframes pop2{from{transform:scale(.6);opacity:0}}
.tbig{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--c,#555) 22%,#0a0820),#0a0820);border:2px solid var(--c,#444);box-shadow:0 0 22px -4px var(--g,transparent)}.tbig b{font-family:"Baloo 2";font-size:21px;color:var(--c)}.tbig em{font-style:normal;color:var(--tx2);font-size:12px}.tbig small{color:var(--tx2);font-size:12px}.tbig .pp{color:var(--c)}.tbig.none{border-style:dashed;color:#888;min-height:130px;justify-content:center}.tbig.none span{font-size:36px}

    emit(e, d) {

      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

            if (eps.econCrit && Math.random() < eps.econCrit.p) amt *= eps.econCrit.mult;
            if (eps.econEvery && u.econN % eps.econEvery.n === 0) amt *= eps.econEvery.mult;

          if (e.hitT <= 0) e.img.clearTint();

          e.dots = e.dots.filter((d) => d.until > now);

          e.dashCd -= dt;

        e.y = tmp.y;

        e.c.setDepth(e.y);

        if (e.ab[i] > 0) return;

        this.bossSkill(e, a);

    }
    bossSkill(e, a) {
      this.say(e.name + ': ' + a.name, 'boss');
      this.ring(e.x, e.y, 0xff6a3a, 4);
      const now = this.now;
      const near = (r) => this.units.filter((u) => Math.hypot(u.x - e.x, u.y - e.y) <= r);
      switch (a.kind) {
        case 'stun': {
          const list = near(a.r).sort(() => Math.random() - 0.5).slice(0, a.n);
          list.forEach((u) => {

            this.ring(u.x, u.y, 0x9ad8ff, 1.4);
            this.popText(u.x, u.y - 70, 'Bị khóa', '#9ad8ff', 15);
          });

        case 'slowUnits':
          near(a.r).forEach((u) => {
            u.slowUntil = now + a.dur;
            this.burst(u.x, u.y - 30, 0xff7a2a, 8);
          });

            this.ring(u.x, u.y, 0xa855f7, 1.4);

      if (k.W.isDown || k.UP.isDown) cam.scrollY -= sp;
      if (k.S.isDown || k.DOWN.isDown) cam.scrollY += sp;

      this.fog.tilePositionY = cam.scrollY * 0.3;
      this.mist.tilePositionX = cam.scrollX * 0.8 + time * 0.05;
      this.mist.tilePositionY = cam.scrollY * 0.8;

        v.img.x += v.vx * real * this.speed;
        v.img.y += v.vy * real * this.speed + Math.sin(time * 0.002 + v.ph) * 0.3;
        v.img.angle += v.rot * 40 * real;
        if (v.img.x > this.W + 20) v.img.x = -20;
        if (v.img.x < -20) v.img.x = this.W + 20;
        if (v.img.y > this.H + 20) v.img.y = -20;
        if (v.img.y < -20) v.img.y = this.H + 20;
      }
      if (!this.paused && !this.state.finished) {
        const dt = Math.min(real, 0.1) * this.speed;
        this.state.time += dt;
        if (ATD.Save.get().admin && ATD.Save.get().adminOpts.infYen) this.state.yen = Math.max(this.state.yen, 99999);

        this.updateWaves(dt);
        this.updateEnemies(dt);
        this.updateUnits(dt);
      }
      this.fitFixed();
      this.drawBars();
      this.hudT += real;
      if (this.hudT > 0.1) {
        this.hudT = 0;
        this.pushHud();
      }
    }
    drawBars() {
      const g = this.hpG;
      g.clear();
      for (const e of this.enemies) {
        if (!e.alive) continue;
        if (!e.isBoss && e.hp >= e.maxHp && e.shield >= e.maxShield) continue;
        const w = Math.max(30, e.size * 0.8);
        const x = e.x - w / 2,
          y = e.y - e.size - 6;
        g.fillStyle(0x12081f, 0.85);
        g.fillRect(x - 1, y - 1, w + 2, 7);
        g.fillStyle(hexNum(ATD.ELEMENTS[e.el].color), 1);
        g.fillCircle(x - 7, y + 2.5, 4.5);
        g.fillStyle(e.isBoss ? 0xff3a5a : 0x5aff8a, 1);
        g.fillRect(x, y, w * Math.max(0, e.hp / e.maxHp), 5);
        if (e.maxShield > 0 && e.shield > 0) {
          g.fillStyle(0x7ad8ff, 0.9);
          g.fillRect(x, y - 3, w * (e.shield / e.maxShield), 3);
        }
      }
      for (const u of this.units) {
        for (let i = 0; i < u.up; i++) {
          g.fillStyle(0xffe27a, 1);
          g.fillCircle(u.x - (u.up - 1) * 5 + i * 10, u.y + 10, 3.2);
        }
        if (this.now < u.disabledUntil) {
          g.lineStyle(2, 0x9ad8ff, 0.8);
          g.strokeCircle(u.x, u.y - 30, 30);
        }
      }
    }
  }
  ATD.BattleScene = BattleScene;
})();

        r = { gold: Math.floor(sr.gold * (1 + (stars - 1) * 0.25)), gems: 0, playerExp: sr.exp, unitExp: sr.unitExp, shards: sr.shards, cores: sr.cores, crystals: 0, items };
        const rec = s.raids[st.id] || { clears: 0, stars: 0 };
        rec.clears++;
        rec.stars = Math.max(rec.stars, stars);
        s.raids[st.id] = rec;
        if (st.raidId) s.stats.raidClears = (s.stats.raidClears || 0) + 1;
      } else if (st.raid) {
        r = { gold: Math.floor(st.reward.gold * 0.05), gems: 0, playerExp: Math.floor(st.reward.exp * 0.2), unitExp: Math.floor(st.reward.unitExp * 0.2), shards: 0, cores: 0, crystals: 0, items: {} };
      } else if (sum.win) {
        s.stats.wins++;
        ATD.Quests.track('win', 1);
        const stars = sum.lives >= sum.maxLives * 0.9 ? 3 : sum.lives >= sum.maxLives * 0.5 ? 2 : 1;
        res.stars = stars;
        const rec = s.stages[st.id] || { cleared: false, stars: 0, best: 0 };
        const first = !rec.cleared;
        res.first = first;
        const sr = st.reward;
        r = {
          gold: Math.floor(sr.gold * (1 + (stars - 1) * 0.25)),
          gems: first ? sr.gems : Math.floor(sr.gems * 0.1),
          playerExp: sr.exp,
          unitExp: sr.unitExp,
          shards: first ? sr.shards : Math.ceil(sr.shards * 0.5),
          cores: first ? sr.cores : 0,
          crystals: first || stars > rec.stars ? sr.crystals + (stars === 3 && !rec.stars3 ? 1 : 0) : 0
        };
        rec.cleared = true;
        rec.stars = Math.max(rec.stars, stars);
        rec.stars3 = rec.stars3 || stars === 3;
        rec.best = Math.max(rec.best || 0, sum.wave);
        s.stages[st.id] = rec;
      } else {
        const f = sum.wave / sum.maxLives / 0 || sum.wave / st.waves;
        r = { gold: Math.floor(st.reward.gold * 0.12 * Math.min(1, sum.wave / st.waves)), gems: 0, playerExp: Math.floor(st.reward.exp * 0.25 * Math.min(1, sum.wave / st.waves)), unitExp: Math.floor(st.reward.unitExp * 0.2 * Math.min(1, sum.wave / st.waves)), shards: 0, cores: 0, crystals: 0 };
      }
      res.rewards = r;
      ATD.Quests.grant({ gold: r.gold, gems: r.gems, crystals: r.crystals, shards: r.shards, cores: r.cores, items: r.items });
      res.playerUps = ATD.Quests.addPlayerExp(r.playerExp);
      sum.units.forEach((u) => {
        const gain = Math.floor(r.unitExp * (u.used ? 1 : 0.5) + u.expGain);
        const before = u.inst.level;
        const out = ATD.Units.addExp(u.inst, gain);
        u.inst.kills = (u.inst.kills || 0) + u.kills;
        u.inst.damage = (u.inst.damage || 0) + u.damage;
        res.units.push({ inst: u.inst, gained: out.gained, from: before, to: u.inst.level, kills: u.kills, damage: u.damage });
      });
      ATD.Quests.checkAchievements();
      ATD.Save.commit();
      ATD.HUD.result(res);
    },
    exit(next) {
      if (this.game) {
        try {
          this.game.destroy(true);
        } catch (e) {
          console.error(e);
        }
      }
      this.game = null;
      this.scene = null;
      this.api = null;
      this.running = false;
      ATD.HUD.unmount();
      document.getElementById('battle-canvas').innerHTML = '';
      document.getElementById('battle').classList.add('hidden');
      document.body.classList.remove('in-battle');
      if (next) ATD.UI.go(next);
      else ATD.UI.render();
    },
    async retry() {
      const id = this.stage.id;
      this.exit();
      await U.sleep(50);
      this.start(id);
    },
    async nextStage() {
      const i = ATD.Stages.list.findIndex((x) => x.id === this.stage.id);
      const nx = ATD.Stages.list[i + 1];
      this.exit();
      if (nx && ATD.Stages.unlocked(i + 1)) {
        await U.sleep(50);
        this.start(nx.id);
      } else ATD.UI.go('battle');
    }
  };
  ATD.Battle = B;
})();

        ${res.playerUps ? `<div class="lvl-up">Lên cấp người chơi! +${ATD.CONFIG.levelUpGems * res.playerUps} Ngọc</div>` : ''}
        <div class="res-units">${res.units.map((u) => `<div class="ru"><img src="${ATD.Art.unitURL(u.inst.id, false)}"><b>${U.esc(ATD.UNIT_DEFS[u.inst.id].name)}</b><small>Lv ${u.to}${u.to > u.from ? ' ▲' : ''}</small><small>+${U.fmt(u.gained)} EXP</small></div>`).join('')}</div>

        <div class="row-btns"><button class="btn" data-rs="lobby">Về Sảnh</button><button class="btn" data-rs="retry">Chơi Lại</button>${nxt && res.win ? '<button class="btn ok" data-rs="next">Màn Kế Tiếp</button>' : ''}</div></div>`;
      m.onclick = (e) => {
        const b = e.target.closest('[data-rs]');

        if (a === 'lobby') ATD.Battle.exit(res.stage.raid ? 'raid' : 'battle');
        if (a === 'retry') ATD.Battle.retry();
        if (a === 'next') ATD.Battle.nextStage();

    },
    shop() {
      const s = S();

      return `<div class="panel main wide"><h2>Cửa Hàng</h2><p class="sub">Toàn bộ vật phẩm đổi bằng tiền trong game. Giới hạn làm mới mỗi ngày.</p><div class="shop-grid">${SHOP.map((it) => {

      return `<div class="panel main wide"><h2>Cài Đặt</h2><label class="row">Âm lượng hiệu ứng<input type="range" min="0" max="1" step="0.05" value="${s.volume}" data-setrange="volume"></label>${tg('particles', 'Hiệu ứng hạt và môi trường')}${tg('damageNumbers', 'Hiển thị số sát thương')}${tg('autoWave', 'Tự động bắt đầu wave kế tiếp')}${tg('haptics', 'Rung khi đặt unit và khi có boss')}<label class="row">Chất lượng đồ họa<select data-set-q><option value="auto" ${ATD.Device.quality() === 'auto' ? 'selected' : ''}>Tự động</option><option value="high" ${ATD.Device.quality() === 'high' ? 'selected' : ''}>Cao</option><option value="low" ${ATD.Device.quality() === 'low' ? 'selected' : ''}>Tiết kiệm pin / máy yếu</option></select></label><div class="row-btns"><button class="btn" data-act="fullscreen">Bật/tắt toàn màn hình</button></div>

      <h3>Dữ liệu</h3><div class="row-btns"><button class="btn" data-act="export">Xuất file lưu</button><button class="btn" data-act="import">Nhập file lưu</button><button class="btn danger" data-act="reset">Xóa toàn bộ dữ liệu</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>

      <h3>Tên người chơi</h3><div class="row"><input type="text" maxlength="20" value="${U.esc(S().player.name)}" data-input="pname"></div></div>`;

  UI.render = function () {
    document.getElementById('topbar').innerHTML = topbar();
    document.getElementById('nav').innerHTML = navHtml();
    const scr = document.getElementById('screen');
    scr.className = 'sc-' + st.screen;
    scr.innerHTML = screens[st.screen]();
  };
  UI.go = async function (name) {
    if (transitioning) return;
    ATD.Audio.play('click');
    if (name === st.screen) {
      UI.render();
      return;
    }
    transitioning = true;
    const cur = document.getElementById('curtain');
    cur.classList.add('on');
    await U.sleep(180);
    st.screen = name;
    UI.render();
    document.getElementById('screen').scrollTop = 0;
    cur.classList.remove('on');
    await U.sleep(120);
    transitioning = false;
  };
  UI.toast = function (msg, type) {
    const r = document.getElementById('toast-root');
    const d = document.createElement('div');
    d.className = 'toast ' + (type || 'info');
    d.textContent = msg;
    r.appendChild(d);
    while (r.children.length > 4) r.removeChild(r.firstChild);
    setTimeout(() => d.remove(), 2800);
  };

  };

  function keepOf(k) {
    st.keep = st.keep || { rare: true, epic: true, legendary: true, mythic: true, secret: true };
    return st.keep[k] !== false;
  }
  async function pullAnim(res) {
    const r = document.getElementById('modal-root');
    const order = ATD.RARITY_ORDER;
    const best = res.results.reduce((a, x) => (order.indexOf(x.rarity) > order.indexOf(a) ? x.rarity : a), 'rare');
    const col = ATD.RARITY[best].color;
    let skip = false;
    r.innerHTML = `<div class="pull-ov" style="--c:${col}"><div class="portal"><i></i><i></i><i></i></div><div class="pull-stage"></div><button class="btn skip" data-skip>Bỏ qua</button></div>`;
    const ov = r.firstChild;
    ov.querySelector('[data-skip]').onclick = () => (skip = true);
    ATD.Audio.play('summon');
    const wait = async (ms) => {
      const t0 = performance.now();
      while (performance.now() - t0 < ms && !skip) await U.sleep(30);
    };
    await wait(1500);
    const stage = ov.querySelector('.pull-stage');
    ov.querySelector('.portal').classList.add('burst');
    if (!skip) {
      for (const x of res.results) {
        if (skip) break;
        if (x.rarity === 'secret') await ATD.Cutscene.secretUnit(x.def);
        stage.innerHTML = `<div class="reveal r-${x.rarity}"><div class="rv-rays"></div><div class="rv-card">${card(x.inst, { cls: 'lg' })}</div><div class="rv-name"><b>${U.esc(x.def.name)}</b><span>${RN(x.rarity)}${x.isNew ? ' · MỚI' : ''}</span></div></div>`;
        ov.classList.toggle('mythic', x.rarity === 'mythic');
        ATD.Audio.play(x.rarity === 'mythic' || x.rarity === 'legendary' ? 'reveal-hi' : 'reveal');
        let go = false;
        const nextBtn = () => (go = true);
        stage.onclick = nextBtn;
        const t0 = performance.now();
        const hold = x.rarity === 'mythic' ? 2600 : x.rarity === 'legendary' ? 1500 : 800;
        while (!go && !skip && performance.now() - t0 < hold + (res.results.length === 1 ? 4000 : 0)) await U.sleep(30);
      }
    }
    ov.classList.remove('mythic');
    stage.onclick = null;
    stage.innerHTML = `<div class="summary"><h2>Kết Quả Triệu Hồi</h2><div class="sum-grid">${res.results.map((x) => card(x.inst, { cls: 'sm', mini: true, extra: x.isNew ? '<em class="newtag">MỚI</em>' : '' })).join('')}</div><button class="btn-big" data-act="closeModal">Xác Nhận</button></div>`;
    ov.querySelector('[data-skip]').remove();
  }
  async function reelAnim(final) {
    const reel = document.getElementById('reel');
    if (!reel) return;
    const all = ATD.TRAIT_DEFS;
    let delay = 40;
    const t0 = performance.now();
    while (performance.now() - t0 < 1600) {
      const t = all[Math.floor(Math.random() * all.length)];
      reel.innerHTML = traitBig(t);
      reel.classList.add('spin');
      ATD.Audio.play('hit');
      await U.sleep(delay);
      delay = Math.min(160, delay * 1.06);
    }
    reel.classList.remove('spin');
    reel.innerHTML = traitBig(final);
  }
  UI.traitReveal = function (t) {
    const r = document.getElementById('modal-root');
    const secret = t.rarity === 'secret';
    if (secret || t.rarity === 'mythic') return ATD.Cutscene.trait(t);
    const big = t.rarity === 'legendary';
    if (!big) return Promise.resolve();
    return new Promise((res) => {
      r.innerHTML = `<div class="trait-ov tr-${t.rarity} ${secret ? 'secret' : ''}" style="--c:${t.color};--g:${t.glow}"><div class="eclipse"><i></i></div><div class="tv-rays"></div><div class="tv-body">${A.traitIcon(t, 120)}<h1>${U.esc(t.name)}</h1><h3>${RN(t.rarity)}${t.tier ? ' · ' + U.esc(t.tier) : ''}</h3><p>${U.esc(t.desc)}</p>${t.lore ? `<p class="lore">${U.esc(t.lore)}</p>` : ''}<small>Tỉ lệ ${ATD.Traits.prob(t.id).toFixed(4)}%</small></div></div>`;
      ATD.Audio.play(secret ? 'secret' : 'reveal-hi');
      const ov = r.firstChild;
      if (secret) document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 1200);
      const close = () => {
        r.innerHTML = '';
        res();
      };
      setTimeout(() => (ov.onclick = close), 900);
      setTimeout(close, secret ? 7000 : 3600);
    });
  };

  UI.init = function () {
    const app = document.getElementById('app');
    app.addEventListener('click', (e) => {
      if (document.body.classList.contains('in-battle')) return;
      const go = e.target.closest('[data-go]');
      if (go) return UI.go(go.dataset.go);
      const a = e.target.closest('[data-act]');
      if (a && actions[a.dataset.act] && !a.disabled) {
        if (a.dataset.act !== 'closeModal' || !a.classList.contains('modal-back') || e.target === a) {
          ATD.Audio.play('click');
          actions[a.dataset.act](a);
        }
      }
    });
    app.addEventListener('input', (e) => {
      const t = e.target;
      if (t.dataset.setrange) {
        S().settings[t.dataset.setrange] = +t.value;
        ATD.Save.commit();
      }
    });
    app.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.set) {
        S().settings[t.dataset.set] = t.checked;
        ATD.Save.commit();
      } else if (t.dataset.setQ !== undefined) {
        S().settings.quality = t.value;
        ATD.Save.commit();
        ATD.Device.apply();
        UI.toast('Đã đổi chất lượng đồ họa', 'info');
      } else if (t.dataset.input === 'sort') {
        st.inv.sort = t.value;
        UI.render();
      } else if (t.dataset.input === 'pname') {
        S().player.name = t.value.trim() || 'Lữ Khách';
        ATD.Save.commit();
        document.getElementById('topbar').innerHTML = topbar();
      } else if (t.id === 'importFile' && t.files[0]) {
        const rd = new FileReader();
        rd.onload = async () => {
          try {
            await ATD.Save.importJSON(rd.result);
            UI.toast('Nhập dữ liệu thành công', 'good');
            UI.render();
          } catch (err) {
            UI.toast('File lưu không hợp lệ', 'warn');
          }
        };
        rd.readAsText(t.files[0]);
      }
    });
    app.addEventListener('keyup', (e) => {
      if (e.target.dataset && e.target.dataset.input === 'search') {
        st.inv.search = e.target.value;
        const pos = e.target.selectionStart;
        UI.render();
        const el = document.querySelector('[data-input="search"]');
        if (el) {
          el.focus();
          el.setSelectionRange(pos, pos);
        }
      }
    });
    ATD.bus.on('save:changed', () => {
      if (!document.body.classList.contains('in-battle') && !st.busy) document.getElementById('topbar').innerHTML = topbar();
    });
  };

            bolt(ctx, cx, cy, cx + Math.cos(a) * w, cy + Math.sin(a) * w, r2, 'rgba(255,140,190,0.7)', 2.5);
          }
          shock(ctx, cx, cy, tm, 3.2, Math.max(w, h), 'rgba(255,90,157,A)', 3);
        }
        vignette(ctx, w, h, 0.8);
        flash(ctx, w, h, tm, 3.15, 0.8, 'rgba(255,230,240,A)');
      }
    });
  }
  async function secretUnit(def) {
    const W = 320,
      Hh = 400;
    let img = null,
      sil = null;
    try {
      img = await A.toImage(A.unitSVG(def, { w: W, h: Hh, evo: true }), W, Hh);
      sil = document.createElement('canvas');
      sil.width = W;
      sil.height = Hh;
      const sc = sil.getContext('2d');
      sc.drawImage(img, 0, 0, W, Hh);
      sc.globalCompositeOperation = 'source-in';
      sc.fillStyle = '#0a0414';
      sc.fillRect(0, 0, W, Hh);
    } catch (e) {}
    const st = stars(180, 3);
    const rnd = U.mulberry32(404);
    const cracks = Array.from({ length: 16 }, (_, i) => {
      const a0 = (i / 16) * 6.2832 + (rnd() - 0.5) * 0.3;
      const pts = [[0, 0]];
      let x = 0,
        y = 0,
        a = a0;
      for (let s = 0; s < 26; s++) {
        a += (rnd() - 0.5) * 0.7;
        const l = 40 + rnd() * 70;
        x += Math.cos(a) * l;
        y += Math.sin(a) * l;
        pts.push([x, y]);
      }
      return pts;
    });
    const orbs = Array.from({ length: 80 }, () => ({ a: rnd() * 6.28, r: 0.15 + rnd() * 0.5, s: 0.3 + rnd() * 1.1, z: 1 + rnd() * 2.5 }));
    const nameHtml = [...def.name.toUpperCase()].map((c, i) => `<span style="animation-delay:${i * 0.13}s">${c}</span>`).join('');
    return run({
      cls: 'secret-unit',
      vars: '--c:#c4b5fd;--g:#7c3aed',
      duration: 16,
      minSkip: 3,
      tail: 12,
      shakes: [[3.4, 2.8], [6.3, 1.4]],
      sfx: [[0.3, 'rumble'], [1.0, 'thump'], [1.9, 'thump'], [2.8, 'crack'], [3.6, 'crack'], [4.3, 'crack'], [4.9, 'thump'], [5.5, 'crack'], [6.2, 'boomBig'], [7.4, 'secret'], [9.5, 'choir'], [10.6, 'shimmer'], [11.2, 'reveal-hi']],
      texts: [
        { at: 0.6, dur: 2.0, html: '<p class="line">Có thứ gì đó đang đáp lại lời triệu gọi của bạn...</p>' },
        { at: 3.0, dur: 2.8, html: '<p class="line">Không gian đang rạn vỡ</p>' },
        { at: 10.6, cls: 'sbanner', html: '<div class="srare">✦ SECRET ✦</div>' },
        { at: 11.0, cls: 'sname', html: `<h1 class="letters">${nameHtml}</h1><h3>${U.esc(def.title)}</h3>` },
        { at: 12.6, cls: 'desc', html: `<p><b>Nội tại · ${U.esc(def.passive.name)}</b></p><p>${U.esc(def.passive.desc)}</p>` }
      ],
      init: () => ({}),
      draw(ctx, tm, w, h) {
        const cx = w / 2,
          cy = h * 0.46;
        const S = Math.min(w, h);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        if (tm < 6.3) {
          const k = clamp(tm / 6, 0, 1);
          drawStars(ctx, st, tm, w, h, 0.25 + k * 0.5);
          const beat = Math.max(0, Math.sin(tm * 4.4)) ** 6;
          const r = 3 + tm * 5 + beat * 12 + (tm > 3 ? (tm - 3) * 22 : 0);
          glow(ctx, cx, cy, r * 6, 'rgba(124,58,237,A)', 0.35 + beat * 0.3 + k * 0.3);
          glow(ctx, cx, cy, r * 2, 'rgba(240,230,255,A)', 0.7);
          if (tm > 2.6) {
            const p = clamp((tm - 2.6) / 3.4, 0, 1);
            ctx.save();
            ctx.translate(cx, cy);
            ctx.lineJoin = 'round';
            cracks.forEach((c, ci) => {
              const total = c.length - 1;
              const upto = p * total;
              for (const pass of [0, 1]) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                for (let i = 1; i <= Math.floor(upto); i++) ctx.lineTo(c[i][0], c[i][1]);
                const fr = upto - Math.floor(upto);
                const i0 = Math.floor(upto);
                if (i0 < total) ctx.lineTo(c[i0][0] + (c[i0 + 1][0] - c[i0][0]) * fr, c[i0][1] + (c[i0 + 1][1] - c[i0][1]) * fr);
                ctx.strokeStyle = pass ? 'rgba(255,255,255,0.95)' : 'rgba(167,139,250,0.55)';
                ctx.lineWidth = pass ? 2 : 9;
                ctx.shadowColor = '#a78bfa';
                ctx.shadowBlur = pass ? 8 : 24;
                ctx.stroke();
              }
            });
            ctx.restore();
          }
        } else {
          const vg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.8);
          vg.addColorStop(0, '#2a0f5a');
          vg.addColorStop(0.5, '#0f0524');
          vg.addColorStop(1, '#020006');
          ctx.fillStyle = vg;
          ctx.fillRect(0, 0, w, h);
          drawStars(ctx, st, tm, w, h, 0.9);
          orbs.forEach((o) => {
            const a = o.a + tm * o.s * 0.5;
            const rr = o.r * S * 1.3 * (1 + Math.sin(tm * 0.7 + o.a) * 0.08);
            ctx.fillStyle = `rgba(216,180,254,${0.25 + 0.4 * Math.abs(Math.sin(tm + o.a))})`;
            ctx.beginPath();
            ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.55, o.z, 0, 6.2832);
            ctx.fill();
          });
          const rk = ease((tm - 6.4) / 1.6);
          ctx.save();
          ctx.translate(cx, cy + S * 0.04);
          ctx.scale(1, 0.42);
          for (let i = 0; i < 3; i++) {
            ctx.rotate(tm * (i % 2 ? -0.25 : 0.2));
            ctx.strokeStyle = `rgba(196,181,253,${0.65 * rk})`;
            ctx.lineWidth = 3 - i * 0.6;
            ctx.shadowColor = '#7c3aed';
            ctx.shadowBlur = 16;
            const rad = S * (0.3 + i * 0.1) * rk;
            ctx.beginPath();
            ctx.arc(0, 0, rad, 0, 6.2832);
            ctx.stroke();
            for (let k = 0; k < 36; k++) {
              const a = (k / 36) * 6.2832;
              ctx.beginPath();
              ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
              ctx.lineTo(Math.cos(a) * (rad - (k % 3 ? 6 : 14)), Math.sin(a) * (rad - (k % 3 ? 6 : 14)));
              ctx.stroke();
            }
          }
          ctx.beginPath();
          for (let k = 0; k < 6; k++) {
            const a = (k / 6) * 6.2832 * 2;
            const rad = S * 0.34 * rk;
            const px = Math.cos(a) * rad,
              py = Math.sin(a) * rad;
            k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
          }
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
          if (img) {
            const ih = Math.min(h * 0.5, 440),
              iw = ih * (W / Hh);
            const rise = ease((tm - 7.0) / 2.4);
            const y = cy + S * 0.04 + (1 - rise) * h * 0.25 - ih * 0.5;
            const reveal = clamp((tm - 9.4) / 1.3, 0, 1);
            const pulse = 1 + Math.sin(tm * 2) * 0.012;
            ctx.save();
            ctx.translate(cx, y + ih / 2);
            ctx.scale(pulse, pulse);
            glow(ctx, 0, 0, ih * 0.9, 'rgba(124,58,237,A)', 0.55 * rise);
            ctx.globalAlpha = rise * (1 - reveal * 0.0);
            ctx.shadowColor = '#a78bfa';
            ctx.shadowBlur = 30 + reveal * 20;
            if (sil) ctx.drawImage(sil, -iw / 2, -ih / 2, iw, ih);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = rise * reveal;
            ctx.drawImage(img, -iw / 2, -ih / 2, iw, ih);
            ctx.restore();
          }
        }
        if (tm > 6.2) shock(ctx, cx, cy, tm, 6.3, Math.max(w, h), 'rgba(233,213,255,A)', 4);
        vignette(ctx, w, h, 0.85);
        flash(ctx, w, h, tm, 6.2, 1.1, 'rgba(255,255,255,A)');
      }
    });
  }
  function trait(t) {
    if (t.id === 'noxeris') return secretTrait(t);
    if (t.id === 'divine') return divineTrait(t);
    if (t.id === 'golden') return goldenTrait(t);
    if (t.id === 'unique') return uniqueTrait(t);
    return Promise.resolve();
  }
  ATD.Cutscene = { trait, secretUnit };
})();

        return `<div class="shopitem">${ATD.Items.icon(it, 48)}<b>${U.esc(it.name)}</b><small>Dành cho ${U.esc(ATD.UNIT_DEFS[it.unit].name)} ${ATD.Elements.icon(it.el, 13)} · đang có ${ATD.Inv.itemCount(it.id)}</small><div class="costs">${H.costHtml(pr)}</div><button class="btn ${ok ? 'ok' : 'dis'}" data-act="buyItem" data-id="${it.id}" ${ok ? '' : 'disabled'}>${left > 0 ? 'Mua · còn ' + left : 'Hết lượt'}</button></div>`;
      })
      .join('')}</div>`;
  };
  A.buyItem = (el) => {
    const it = ATD.ITEMS[el.dataset.id];
    const s = S();
    const key = 'it:' + it.id;
    const pr = ATD.Items.price(it);
    if (!pr || (s.shop.bought[key] || 0) >= 3 || !H.canPay(pr)) return UI.toast('Không thể mua vật phẩm này', 'warn');
    Object.keys(pr).forEach((k) => (s.player[k] -= pr[k]));
    ATD.Inv.addItem(it.id, 1);

    ATD.Save.commit();

      }
    }
  });
})();
</script>

      ${own.length ? own.slice(0, 1).map((u) => (u.evo < 3 ? `<div class="kv"><span>Cần cho ★${u.evo + 1}</span><b>${ATD.Inv.itemNeed(u)}</b></div>` : '<div class="kv"><span>Tiến hóa</span><b>Tối đa</b></div>')).join('') : '<p class="sub">Bạn chưa sở hữu unit này.</p>'}
      <div class="kv"><span>Nguồn</span><b>${raid ? 'Raid ' + U.esc(raid.name) : ''}${ATD.Items.price(it) ? ' · Cửa Hàng' : ''}</b></div>

  document.getElementById('app').addEventListener('input', (e) => {

<script>(function () {
  const ATD = window.ATD;
  async function boot() {
    try {
      await ATD.Save.init();
      ATD.Device.apply();
      ATD.Quests.ensureDaily();
      ATD.UI.init();
      ATD.UI.render();
      initSparks();
    } catch (e) {
      console.error(e);
      document.getElementById('loading').querySelector('p').textContent = 'Lỗi khởi động: ' + e.message;
      return;
    }
    document.getElementById('loading').classList.remove('on');
  }
  function initSparks() {
    const c = document.getElementById('fx-bg');
    const g = c.getContext('2d');
    let w, h;
    const resize = () => {
      w = c.width = innerWidth;
      h = c.height = innerHeight;
    };
    resize();
    addEventListener('resize', resize);
    const ps = Array.from({ length: ATD.Device.low() ? 18 : 60 }, () => ({ x: Math.random() * w, y: Math.random() * h, r: 0.6 + Math.random() * 2.2, v: 8 + Math.random() * 26, a: Math.random() * 6, h: 200 + Math.random() * 140 }));
    let last = performance.now();
    function loop(t) {
      if (ATD.Device.low() && t - last < 33) return requestAnimationFrame(loop);
      const dt = Math.min(0.05, (t - last) / 1000);
      last = t;
      if (!document.body.classList.contains('in-battle') && ATD.Save.get().settings.particles) {
        g.clearRect(0, 0, w, h);
        ps.forEach((p) => {
          p.y -= p.v * dt;
          p.x += Math.sin(t / 1500 + p.a) * 10 * dt;
          if (p.y < -10) {
            p.y = h + 10;
            p.x = Math.random() * w;
          }
          g.fillStyle = `hsla(${p.h},90%,75%,${0.25 + 0.35 * Math.sin(t / 900 + p.a) ** 2})`;
          g.beginPath();
          g.arc(p.x, p.y, p.r, 0, 7);
          g.fill();
        });
      } else if (document.body.classList.contains('in-battle')) g.clearRect(0, 0, w, h);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
  window.addEventListener('error', (e) => console.error('ATD error:', e.message, e.filename, e.lineno));
  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
